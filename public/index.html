<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover lets a phone browser report the notch and home bar, so the app keeps clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <!-- An iPhone zooms the page in whenever a text box smaller than 16px is tapped, and stays zoomed.
         Telling iPhones not to zoom stops that; pinching to zoom still works there. Other phones never did it. -->
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no');
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CourtSide</title>
    <!-- What a pasted link shows in iMessage, Instagram and elsewhere. -->
    <meta name="description" content="The social media app for tennis. Post your clips, find people to hit with, and ask real coaches about your game." />
    <meta property="og:site_name" content="CourtSide" />
    <meta property="og:title" content="CourtSide — the social media app for tennis" />
    <meta property="og:description" content="Post your clips, find people to hit with, and ask real coaches about your game." />
    <meta property="og:type" content="website" />
    <!-- An invite link (…/join?ref=handle, the same page) unfurls with a picture, not plain text. -->
    <meta property="og:image" content="https://app.courtsidebase.com/waitlist/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CourtSide on an iPhone, next to the words: the social media app for tennis." />
    <meta name="twitter:card" content="summary_large_image" />
    <style id="expo-reset">
      html, body { height: 100%; overscroll-behavior: none; }
      body { overflow: hidden; margin: 0; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
