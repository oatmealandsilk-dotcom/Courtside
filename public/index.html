    <!-- viewport-fit=cover lets a phone browser report the notch and home bar, so the app keeps clear of them. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no" />
    <!-- An iPhone zooms the page in whenever a text box smaller than 16px is tapped, and stays zoomed.
         Telling iPhones not to zoom stops that; pinching to zoom still works there. Other phones never did it. -->
    <script>
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        document.querySelector('meta[name=viewport]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, shrink-to-fit=no');
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CourtSide</title>

      html, body { height: 100%; overscroll-behavior: none; }

      #root { display: flex; height: 100%; flex: 1; }

    <!-- The app's data and pictures come from auth.courtsidebase.com: the connection is opened while the script downloads. -->
    <link rel="preconnect" href="https://auth.courtsidebase.com" crossorigin />
    <link rel="dns-prefetch" href="https://auth.courtsidebase.com" />
    <!-- A signed-out visitor's first Feed page is asked for now, while the app's script is still downloading, instead of
         after it has run. The request is the one the app makes itself (guest_feed, the first 20; GUEST_PAGE in
         src/data/api.ts), with the same public key the waitlist page uses; src/data/remote.ts (guestFeed) takes the answer
         once if it is here, and otherwise (an error, a signed-in visitor, any other address) asks as before. -->
    <script>
      (function () {
        try {
          if (location.hostname !== 'app.courtsidebase.com') return;
          if (window.localStorage.getItem('sb-cgitvbnvchmofqkhtlml-auth-token')) return;
          var key = 'sb_publishable_8PesptF4vNXClY9w2cit-A_LiSY4Zjj';
          var asked = fetch('https://auth.courtsidebase.com/rest/v1/rpc/guest_feed', {
            method: 'POST',
            headers: { apikey: key, Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_before: null, p_limit: 20 })
          }).then(function (r) { if (!r.ok) throw new Error('guest_feed ' + r.status); return r.json(); });
          asked.catch(function () { window.__csGuestFeed = undefined; });
          window.__csGuestFeed = asked;
        } catch (e) { /* the app asks itself */ }
      })();
    </script>
    <!-- The icon font, small and early. The ~300 icons the app uses are one 43 KB file (fonts/ionicons-used.woff2),
         fetched in parallel with the app's script instead of after it (the loader waits on it); any other icon comes
         from the rest of the set (fonts/ionicons.woff2), fetched only if one is ever drawn: the two ranges never
         overlap, so one icon never fetches both. The empty rule under expo-font's own id tells it "ionicons" is
         there, so it does not add the 213 KB .ttf from the bundle (and the real rules sit apart from it, since
         expo-font moves its element, which would build them again). After adding an icon, regenerate the small
         file with scripts/ionicons-subset.py (until then the new icon simply comes from the rest of the set). -->
    <link rel="preload" href="/fonts/ionicons-used.woff2" as="font" type="font/woff2" crossorigin />
