<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CourtSide — The social media app for tennis</title>
<!--
  courtsidebase.com lands here (Cloudflare's redirect, with ?ref= when a link
  carries one). Since Oct 17 it goes straight on into the app itself
  (owner: "Should courtsidebase.com just be the web version of our app,
  except it keeps pushing ppl to get it on the app store", then guest mode:
  "we still want people to be able to read discussions etc, or even view
  videos"). Signed out, the app opens read-only on the Feed, with a slim
  "Get the iPhone app" strip.

  On the way it notes the visit for Admin → Links (log_link_event, migration
  161: the label, the kind and a random id this browser made up; never a
  name or an email), and carries the person who shared the link (a player's
  handle, an affiliate's code, or a friend's waitlist code r=…) into the app,
  so whoever signs up is still credited to them. A campaign label (fb,
  reddit…) is counted here and not carried: it is not a person.

  The old information page is kept at welcome.html.
-->
<meta name="description" content="The social media app for tennis. Part Instagram, part Reddit, all tennis: post your clips, discuss hot takes, find people to hit with, and ask real coaches about your game.">
<meta property="og:title" content="CourtSide — the social media app for tennis">
<meta property="og:description" content="Part Instagram, part Reddit, all tennis. Get the iPhone app now, free.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://courtsidebase.com/">
<meta property="og:image" content="https://app.courtsidebase.com/waitlist/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CourtSide on an iPhone, next to the words: the social media app for tennis.">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#F8F7F2">
<noscript><meta http-equiv="refresh" content="0; url=https://app.courtsidebase.com/"></noscript>
<style>
  :root { --bg: #F8F7F2; --text: #18201B; --muted: #5C6660; --brand: #3F7049; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
  .name { font-weight: 700; font-size: 28px; letter-spacing: -0.8px; color: var(--brand); }
  p { margin: 0; color: var(--muted); }
  a { color: var(--brand); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="name">CourtSide</div>
  <p>Opening CourtSide… <a id="go" href="https://app.courtsidebase.com/">Open it now</a></p>
  <p><a href="welcome.html">About CourtSide</a></p>
</main>
<script>
  (function () {
    // The same public key the app ships with, and only the one function it may call here.
    var SUPABASE_URL = 'https://auth.courtsidebase.com';
    var SUPABASE_KEY = 'sb_publishable_8PesptF4vNXClY9w2cit-A_LiSY4Zjj';
    // Keep in step with the server's campaign_label (migration 161) and welcome.html's list.
    var CAMPAIGNS = ['instagram', 'ig', 'insta', 'courtsidebase', 'courtside', 'reddit', 'tiktok', 'facebook', 'fb', 'fbdm', 'fbgroup', 'twitter', 'threads', 'youtube', 'snapchat', 'whatsapp', 'discord', 'linktree', 'linkinbio', 'bio', 'email', 'newsletter', 'qr', 'flyer', 'poster', 'google', 'share', 'web', 'app', 'testflight', 'beta', 'robertzchen', 'robchzn', 'gipsperformance'];
    var params = new URLSearchParams(location.search);
    var ref = (params.get('ref') || params.get('utm_source') || '').trim().toLowerCase().replace(/^@+/, '');
    var code = (params.get('r') || '').trim().toLowerCase();
    var label = /^[a-z0-9_]{2,24}$/.test(ref) ? ref : null;

    // 1. Count the visit, once a day per label from this browser (the server holds to that too).
    if (label) {
      var newId = function () {
        try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
        var b = new Uint8Array(16);
        try { crypto.getRandomValues(b); } catch (e) { for (var i = 0; i < 16; i++) b[i] = Math.floor(Math.random() * 256); }
        b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
        var h = Array.prototype.map.call(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
        return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
      };
      var visitor = null;
      try {
        visitor = localStorage.getItem('courtside-visitor');
        if (!/^[0-9a-f-]{36}$/.test(visitor || '')) { visitor = newId(); localStorage.setItem('courtside-visitor', visitor); }
      } catch (e) {}
      if (!visitor) visitor = newId();
      var today = new Date().toDateString();
      var seen = null;
      try { seen = localStorage.getItem('courtside-seen-' + label); } catch (e) {}
      if (seen !== today) {
        try {
          // keepalive: the note still lands while the page moves on to the app.
          fetch(SUPABASE_URL + '/rest/v1/rpc/log_link_event', {
            method: 'POST', keepalive: true,
            headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ p_label: label, p_kind: 'visit', p_visitor: visitor }),
          }).catch(function () {});
          localStorage.setItem('courtside-seen-' + label, today);
        } catch (e) {}
      }
    }

    // 2. On into the app, carrying the person who shared it (never a campaign label).
    var to = 'https://app.courtsidebase.com/';
    if (label && CAMPAIGNS.indexOf(label) < 0) to += '?ref=' + encodeURIComponent(label);
    else if (/^[0-9a-f]{8}$/.test(code)) to += '?r=' + code;
    document.getElementById('go').setAttribute('href', to);
    // A moment for the visit's note to leave (it is sent with keepalive either way).
    setTimeout(function () { location.replace(to); }, 60);
  })();
</script>
</body>
</html>
