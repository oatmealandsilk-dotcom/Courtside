name: Deploy web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Align package versions with the installed Expo SDK
        run: npx --yes expo install --fix && npm install --legacy-peer-deps

      - name: Check the public Supabase settings are configured
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_KEY" ]; then
            echo "::error::Add EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_KEY under Settings → Secrets and variables → Actions → Variables, then re-run this workflow. The live site was left as it was."
            exit 1
          fi

      - name: Export static web build
        env:
          # Project pages are served from https://<user>.github.io/<repo>/
          # Served from app.courtsidebase.com (see public/CNAME), so the app sits
          # at the root rather than under /<repo>.
          EXPO_BASE_URL: ''
          # Public-safe values, kept out of the repo so .env never needs to be
          # committed. Set under Settings → Secrets and variables → Variables.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
        run: npx expo export --platform web --output-dir dist

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # A browser can hold the old index.html for up to ten minutes after a
      # deploy, and that page points at the old script by name. Keep the
      # previous build's script alongside the new one so those visitors still
      # get an app rather than a blank page.
      - name: Keep the previous build's script alive
        run: |
          site="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          old=$(curl -fsSL "$site/" | grep -o '_expo/static/js/web/entry-[a-f0-9]*\.js' | head -1 || true)
          if [ -n "$old" ] && [ ! -f "dist/$old" ]; then
            mkdir -p "$(dirname "dist/$old")"
            curl -fsSL "$site/$old" -o "dist/$old" && echo "kept $old" || echo "previous script not fetchable; skipping"
          else
            echo "nothing to keep"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
